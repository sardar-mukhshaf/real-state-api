spring:
  application:
    name: real-estate-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/real_estate}
    username: ${DATABASE_USER:real_estate}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
      file-size-threshold: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
server:
  port: ${PORT:3000}
  shutdown: graceful
  max-http-request-header-size: 16KB
  forward-headers-strategy: none
  tomcat:
    max-http-form-post-size: 26MB
    max-swallow-size: 26MB
    connection-timeout: 10s
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  server:
    port: ${MANAGEMENT_PORT:3001}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: logstash
app:
  environment: ${APP_ENV:local}
  rate-limit: {}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:real-estate-api}
    audience: ${JWT_AUDIENCE:real-estate-clients}
    access-seconds: ${ACCESS_TOKEN_SECONDS:900}
    refresh-seconds: ${REFRESH_TOKEN_SECONDS:2592000}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    bucket: ${S3_BUCKET:real-estate}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
