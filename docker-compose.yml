services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U real_estate -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  s3:
    image: minio/minio:latest
    command: server /data --address ":9090" --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-local-development}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-local-development}
    ports:
      - "9090:9090"
      - "9091:9091"
    volumes:
      - s3-data:/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/real_estate
      DATABASE_USER: real_estate
      REDIS_HOST: redis
      S3_ENDPOINT: http://s3:9090
      S3_PUBLIC_ENDPOINT: http://localhost:9090
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  s3-data: