name: Java verification
on:
  push:
    paths: ["**", ".github/workflows/java.yml"]
  pull_request:
    paths: ["**", ".github/workflows/java.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify with PostgreSQL, Redis and S3 containers
        run: chmod +x mvnw && ./mvnw -B -ntp verify -Psbom
      - name: Upload reports and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/bom.*
      - name: Build runtime image
        run: docker build -t real-estate-api:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: real-estate-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

